session_name: devnet
before_script: ./setup-devnet.sh
windows:
        - layout: tiled
          panes:
                  - shell_command:
                            - offckb node
                  - shell_command:
                            - ./wait_for_rpc.sh
                            - ckb miner
                  - shell_command:
                            - sleep 3.0
                            - ./print_accounts.sh
                  - shell_command:
                            - ./wait_for_rpc.sh
                            - ./fund_omni_accounts.sh && ckb-cli
        - panes:
                  - shell_command:
                            - ./run_bootstrap.sh
