# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: 1.23
      - uses: actions/checkout@v3
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23

      - name: Install contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf libc6-dev-riscv64-cross libc6-riscv64-cross linux-libc-dev-riscv64-cross
          wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 18 && rm llvm.sh
          cargo install cargo-generate
          rustup target add riscv64imac-unknown-none-elf

      - name: Create Symlink
        run: sudo ln -s /usr/riscv64-linux-gnu/include/gnu/stubs-lp64d.h /usr/riscv64-linux-gnu/include/gnu/stubs-lp64.h

      - name: Start devnet in background
        env:
          RUSTFLAGS: "-C linker=rust-lld"
          CARGO_TARGET_RISCV64IMAC_UNKNOWN_NONE_ELF_LINKER: rust-lld
          CC_riscv64imac_unknown_none_elf: riscv64-unknown-elf-gcc
          AR_riscv64imac_unknown_none_elf: riscv64-unknown-elf-ar
          C_INCLUDE_PATH: /usr/riscv64-linux-gnu/include
          CFLAGS: "-I/usr/riscv64-linux-gnu/include"
          TARGET_CFLAGS: "-I/usr/riscv64-linux-gnu/include"
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sed gawk expect make nodejs npm
          sudo npm install -g @offckb/cli
          curl -LO https://github.com/nervosnetwork/ckb/releases/download/v0.201.0/ckb_v0.201.0_x86_64-unknown-linux-gnu.tar.gz
          tar -xzf ckb_v0.201.0_x86_64-unknown-linux-gnu.tar.gz
          sudo cp ckb_v0.201.0_x86_64-unknown-linux-gnu/ckb /usr/local/bin/
          curl -LO https://github.com/nervosnetwork/ckb-cli/releases/download/v1.13.0/ckb-cli_v1.13.0_x86_64-unknown-linux-gnu.tar.gz
          tar -xzf ckb-cli_v1.13.0_x86_64-unknown-linux-gnu.tar.gz
          sudo cp ckb-cli_v1.13.0_x86_64-unknown-linux-gnu/ckb-cli /usr/local/bin/
          wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.0g-2ubuntu4_amd64.deb
          sudo dpkg -i libssl1.1_1.1.0g-2ubuntu4_amd64.deb
          sudo npm install -g @offckb/cli

          git submodule update --init --recursive
            cd ./devnet
            chmod +x setup-devnet.sh print_accounts.sh deploy_contracts.sh sudt_helper.sh fund_omni_accounts.sh

            # Bootstrap offckb so its config files exist, then patch the miner
            # to 1s blocks. Default is 5s, which is too slow for the dispute
            # tests: TestPaymentChannelDispute waits only WaitWatcherTimeout=1s
            # between Register and Settle, so with 5s blocks no new block is
            # mined in between and the Withdraw tx's HeaderDep tip timestamp
            # equals the dispute block's timestamp, triggering the contract's
            # TimeLockNotExpired check (PCTS error 69).
            offckb node > /dev/null 2>&1 &
            sleep 8
            sudo pkill -f "offckb-nodejs/bins.*/ckb" || true
            sleep 3
            sed -i 's/^value = 5000/value = 1000/' ~/.local/share/offckb-nodejs/devnet/ckb-miner.toml

            ./setup-devnet.sh
            offckb node > /dev/null 2>&1 &
            sleep 12
            ./print_accounts.sh
            env -u C_INCLUDE_PATH -u CFLAGS -u TARGET_CFLAGS \
              go run ../cmd/get_address.go
            sleep 6
            ./fund_omni_accounts.sh
            sleep 10
          ./deploy_contracts.sh
          ./wait_for_file.sh ./contract/migrations_lp/dev
          ./wait_for_deploy_committed.sh
            ./sudt_helper.sh fund
            sleep 15
            env -u C_INCLUDE_PATH -u CFLAGS -u TARGET_CFLAGS \
              go run ../cmd/fund_sudt.go
            sleep 10
          ./sudt_helper.sh balances
          cd ..

      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v -timeout 600s ./...
      - name: Race
        run: go test -v -race -timeout 600s ./...
